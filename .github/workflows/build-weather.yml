name: Build Weather addon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build weather APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Assemble release APK
        working-directory: addons/weather
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Show what was built
        working-directory: addons/weather
        run: ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: weather-apk
          path: addons/weather/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
